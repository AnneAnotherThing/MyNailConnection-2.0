<!DOCTYPE html>
<!-- Source for og-image-2026-09.png, the site's share card (1200x630).
     Render: chrome --headless=new --window-size=1200,630 --screenshot=og-image-2026-09.png campaign/og-image-2026-09.html
     3.0 identity: white first, ink, mauve #A2636C, blush; Playfair Display + DM Sans. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="insta-ads/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:'DM Sans',sans-serif;color:#141317;-webkit-font-smoothing:antialiased;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 80% at 88% 50%, rgba(247,226,227,.9) 0%, rgba(247,226,227,0) 70%),#fff}
.art{position:absolute;right:-40px;top:-30px;width:690px;height:690px;background:url(../images/lady-card.webp) center/cover;
  -webkit-mask:linear-gradient(90deg,transparent 0%,#000 22%);mask:linear-gradient(90deg,transparent 0%,#000 22%)}
.copy{position:absolute;left:76px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:19px;font-weight:700;letter-spacing:4.5px;text-transform:uppercase;color:#A2636C}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:82px;line-height:1.02;letter-spacing:-1.5px;margin-top:18px}
h1 em{font-style:italic;color:#A2636C}
.sub{font-size:27px;line-height:1.4;color:#6D6068;margin-top:22px;max-width:470px}
.chips{display:flex;gap:10px;margin-top:28px}
.chips span{font-size:19px;font-weight:600;color:#A2636C;background:#F7E2E3;border:1.5px solid rgba(162,99,108,.28);border-radius:100px;padding:8px 18px}
.url{position:absolute;left:76px;bottom:46px;font-size:22px;font-weight:600;color:#6D6068;letter-spacing:.2px}
</style></head><body>
<div class="bg"></div><div class="art"></div>
<div class="copy">
  <div class="eyebrow">My Nail Connection</div>
  <h1>A home for<br><em>your work.</em></h1>
  <p class="sub">Post your sets, get found by clients near you. They book, call or text, your way.</p>
  <div class="chips"><span>No commission</span><span>No per-booking fee</span><span>Nails only</span></div>
</div>
<div class="url">mynailconnection.com</div>
</body></html>
