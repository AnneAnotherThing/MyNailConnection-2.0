<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Playfair';src:url('PlayfairDisplay.ttf');font-weight:400 900;font-style:normal;font-display:block;}
@font-face{font-family:'Playfair';src:url('PlayfairDisplay-Italic.ttf');font-weight:400 900;font-style:italic;font-display:block;}
@font-face{font-family:'DMSans';src:url('DMSans.ttf');font-weight:100 1000;font-style:normal;font-display:block;}
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rose:#C4786A;--rose-dark:#8B4A40;--rose-light:#FDF0EE;--rose-mid:#E0A898;
  --gold:#A07840;--gold-light:#F5EDE0;--cream:#FAF7F4;--charcoal:#2C2420;--muted:#8A7A74;
}
html,body{width:1080px;height:1920px;}
.slide{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  font-family:'DMSans',sans-serif;color:var(--charcoal);
  background:
    radial-gradient(ellipse 72% 46% at 20% 13%, rgba(224,168,152,0.42), transparent 60%),
    radial-gradient(ellipse 66% 46% at 88% 90%, rgba(201,169,110,0.26), transparent 60%),
    radial-gradient(ellipse 120% 70% at 50% 48%, rgba(253,240,238,0.55), transparent 72%),
    linear-gradient(168deg,#FBEBE7 0%,#FAF7F4 48%,#F4EADD 100%);
}
/* faint oversized signature spark, watermark */
.watermark{position:absolute;top:-120px;right:-140px;width:560px;height:560px;color:var(--rose-mid);opacity:0.10;}
.watermark svg{width:100%;height:100%;}
.watermark.bl{top:auto;right:auto;bottom:-150px;left:-160px;width:480px;height:480px;opacity:0.08;color:var(--gold);}
/* eyebrow / wordmark */
.eyebrow{position:absolute;top:250px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;}
.eyebrow img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(139,74,64,0.25));}
.eyebrow span{font-size:23px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--gold);}
/* centered content band, clear of top/bottom IG safe zones */
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:380px 120px 360px;}
.spark{width:58px;height:58px;color:var(--rose-mid);margin-bottom:40px;filter:drop-shadow(0 3px 8px rgba(196,120,106,0.25));}
h1{font-family:'Playfair',serif;font-weight:600;font-size:96px;line-height:1.12;letter-spacing:-1.5px;color:var(--rose-dark);}
h1 em{font-style:italic;color:var(--rose);}
.sub{font-size:37px;line-height:1.55;color:#6E5F58;margin-top:40px;max-width:780px;font-weight:400;}
/* progress dots */
.dots{position:absolute;left:0;right:0;bottom:285px;display:flex;align-items:center;justify-content:center;gap:18px;}
.dots i{width:15px;height:15px;border-radius:50%;background:rgba(139,74,64,0.20);display:block;}
.dots i.on{width:44px;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--rose-dark));}
/* slide 5 cards */
.cards{display:flex;flex-direction:column;gap:30px;margin-top:54px;width:100%;max-width:800px;}
.card{background:rgba(255,255,255,0.82);border:1px solid rgba(196,120,106,0.18);border-radius:30px;
  padding:42px 48px;text-align:left;box-shadow:0 12px 40px rgba(139,74,64,0.08);}
.card .plat{font-size:27px;font-weight:700;letter-spacing:0.5px;color:var(--rose-dark);margin-bottom:10px;}
.card .step{font-size:31px;line-height:1.5;color:#6E5F58;}
/* slide 6 */
.biglogo{width:172px;height:172px;object-fit:contain;margin-bottom:46px;filter:drop-shadow(0 6px 18px rgba(139,74,64,0.28));}
.url{display:inline-block;margin-top:48px;background:linear-gradient(135deg,var(--rose) 0%,var(--rose-dark) 100%);
  color:#fff;font-size:36px;font-weight:600;letter-spacing:0.3px;padding:26px 52px;border-radius:100px;
  box-shadow:0 10px 30px rgba(196,120,106,0.38);}
.tiny{margin-top:30px;font-size:27px;color:var(--muted);letter-spacing:0.5px;}
</style></head>
<body><div class="slide">
<div class="watermark"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></div><div class="watermark bl"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></div>
<div class="eyebrow"><img src="logo.png" alt=""><span>My Nail Connection</span></div>
<div class="content"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg><h1>Here’s <em>how.</em></h1><div class="cards"><div class="card"><div class="plat">On iPhone</div><div class="step">Open it in Safari, tap Share, then “Add to Home Screen.”</div></div><div class="card"><div class="plat">On Android</div><div class="step">Open it in Chrome, tap the menu, then “Install app.”</div></div></div></div>
<div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div>
</div></body></html>
