# Supabase CLI / function deployment config.
#
# Each [functions.<name>] block controls how that function is deployed
# and gated. `verify_jwt = false` disables the Supabase gateway's JWT
# requirement on inbound requests, necessary for any function that
# receives traffic from external services that authenticate themselves
# differently (Stripe uses Stripe-Signature, not a Bearer JWT).
#
# Without this, the gateway 401s those requests before they reach the
# function, and our function's own signature verification never runs.
# Anne hit exactly that on 2026-04-22 when test-mode Stripe webhooks
# started returning 401 Unauthorized.

[functions.stripe-webhook]
verify_jwt = false

[functions.send-push]
# send-push is called from our own authenticated app, so JWT-verify is
# fine (default true), callers pass the user's access token.

[functions.broadcast-push]
# Same as send-push: only our admin UI calls it, with the admin's JWT.

[functions.revenuecat-webhook]
# MUST stay false. RevenueCat authenticates with a STATIC Authorization
# header (a shared secret we compare against REVENUECAT_WEBHOOK_AUTH_HEADER),
# not a Supabase JWT. With verify_jwt on, the gateway 401s every webhook
# before our handler runs, and the symptom is the quiet one: purchases
# succeed, Apple takes the money, RevenueCat reports delivered, and
# techs.subscription_tier never flips to 'paid'.
#
# This block was MISSING until 2026-08-21. The function was deployed from the
# dashboard on 2026-08-17, where the toggle is set in the UI, so it has been
# fine — but config.toml wins on a CLI deploy, and the CLI is now how these
# get shipped. Without this, the next `supabase functions deploy
# revenuecat-webhook` would silently turn verification back on.
verify_jwt = false
