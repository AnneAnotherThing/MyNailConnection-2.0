# ─────────────────────────────────────────────────────────────────────────
# GitHub Pages auto-deploy
#
# On every push to main, publishes the contents of deploy/ghpages/ to the
# GitHub Pages site at mynailconnection.com. Nothing else in the repo
# (sql/, supabase/, node_modules/, android/, CLAUDE.md, etc.) gets served
# publicly, only the curated deploy/ghpages/ tree goes up.
#
# Context: Anne moved off Netlify on 2026-04-23 to stop burning build
# credits. This Action replaces the old "drag the zip into Netlify" step.
# Workflow now: Claude edits source → runs deploy/sync.sh (regenerates
# deploy/ghpages/) → Anne pushes main via GitHub Desktop → this Action
# deploys → site updates within ~2 minutes.
#
# Pages source MUST be configured as "GitHub Actions" (not "Deploy from a
# branch") in the repo's Settings → Pages page for this to take effect.
# ─────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    # 3.0 CUTOVER, 2026-08-17: this was [main]. `v3` is now the default branch
    # and the only one that deploys.
    #
    # Why the branches were never merged: `main` accumulated ~130 commits all
    # named "v3 preview refresh: …", each one a re-commit of v3's work so it
    # could be previewed at /v3/ without disturbing the live 2.0 site. v3 has
    # 166 real commits of the same work. Same content, two irreconcilable
    # histories — `git merge` would have been a conflict storm that bought
    # nothing. Switching the trigger sidesteps it completely.
    #
    # `main` is kept, frozen, as the rollback: point this back at [main] and
    # flip the GitHub default branch back, and the old site returns intact.
    # Nothing was force-pushed and no history was rewritten.
    branches: [v3]
  # Allow manual re-run from the Actions tab without needing a new commit.
  workflow_dispatch:

# Grant the Action the minimum permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; skip redundant runs, don't cancel
# in-flight ones (so a quick follow-up push doesn't kill a mid-deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (deploy/ghpages/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy/ghpages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
