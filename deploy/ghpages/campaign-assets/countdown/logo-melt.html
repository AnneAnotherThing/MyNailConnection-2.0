<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>MNC, You Loved 2.0</title>
<!-- Logo melt: the 2.0 mark dissolves into the 3.0 mark.
     Use for the logo-reveal post (or drop day). Open full screen,
     record ~10 seconds, post. Tap or space replays.
     Needs logo-2.png and logo-3.png in the same folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rose:      #BFA6BB;
    --rose-dark: #7D6478;
    --cream:     #FBF8FA;
    --charcoal:  #141317;
    --muted:     #8B7F8A;
  }
  html, body { height: 100%; background: #F7F5F8; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--charcoal);
    display: flex; align-items: center; justify-content: center;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 0.5625));
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 15% 88%, rgba(191,166,187,0.30) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 6%, rgba(247,232,238,0.85) 0%, transparent 55%),
      #FBF8FA;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    text-align: center;
    padding: 7vh 6vw 5vh;
  }
  .stage::before {
    content: '';
    position: absolute; inset: -20%;
    background: radial-gradient(ellipse at 30% 70%, rgba(191,166,187,0.14) 0%, transparent 45%);
    animation: glowdrift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes glowdrift {
    from { transform: translate(-4%, 3%) scale(1); }
    to   { transform: translate(5%, -4%) scale(1.12); }
  }

  canvas#petals { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .top, .mid, .foot { position: relative; z-index: 2; }
  .top { display: flex; flex-direction: column; align-items: center; }

  .mark {
    font-family: 'Playfair Display', serif;
    font-size: 7.2vh; font-weight: 700; letter-spacing: 0.06em; line-height: 1;
    color: var(--charcoal);
    text-shadow: 0 2px 0 rgba(255,255,255,0.9);
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.25s forwards;
  }
  .mark-sub {
    margin-top: 0.8vh;
    font-size: 1.5vh; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--rose-dark);
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.45s forwards;
  }
  .aud {
    margin-top: 2.6vh;
    background: var(--rose-dark);
    color: #FBF8FA;
    border-radius: 100px;
    padding: 1.3vh 3.2vh;
    font-size: 1.9vh; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase;
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.65s forwards;
  }
  .phase {
    margin-top: 2.8vh;
    font-size: 1.7vh; font-weight: 500; letter-spacing: 0.55em; text-transform: uppercase;
    color: var(--rose-dark);
    opacity: 0; animation: trackin 1.1s cubic-bezier(0.22,0.9,0.3,1) 0.9s forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(2.4vh); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes trackin {
    from { opacity: 0; letter-spacing: 0.9em; }
    to   { opacity: 1; letter-spacing: 0.55em; }
  }

  .mid { display: flex; flex-direction: column; align-items: center; }

  /* ── The melt ── */
  .logo-wrap {
    position: relative;
    width: 32vh; height: 32vh;
    margin-bottom: 4vh;
  }
  .logo-wrap img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 6vh;
  }
  /* New mark is full-bleed art (hat lady), not a plaque: fill the card */
  .logo-new {
    object-fit: cover;
    box-shadow: 0 10px 34px rgba(125,100,120,0.28);
  }
  .logo-old {
    opacity: 0;
    animation:
      oldin 0.9s cubic-bezier(0.22,0.9,0.3,1) 1.2s forwards,
      meltout 1.7s cubic-bezier(0.6,0.05,0.8,0.4) 3.6s forwards;
  }
  @keyframes oldin {
    from { opacity: 0; transform: translateY(2vh) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes meltout {
    0%   { opacity: 1; transform: translateY(0) scale(1);        filter: blur(0) saturate(1); }
    60%  { opacity: 0.55; transform: translateY(3vh) scale(0.97, 0.93); filter: blur(9px) saturate(0.6); }
    100% { opacity: 0; transform: translateY(7vh) scale(0.94, 0.82); filter: blur(20px) saturate(0.3); }
  }
  .logo-new {
    opacity: 0;
    animation: newin 1.7s cubic-bezier(0.16,1.1,0.3,1) 4.5s forwards;
  }
  @keyframes newin {
    0%   { opacity: 0; transform: translateY(-2.5vh) scale(1.1); filter: blur(18px); }
    55%  { opacity: 1; filter: blur(3px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  /* soft ring when the new mark lands */
  .logo-wrap::after {
    content: '';
    position: absolute; left: 50%; top: 50%;
    width: 30vh; height: 30vh;
    border: 1px solid rgba(125,100,120,0.45);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    opacity: 0;
    animation: pulse 1.3s cubic-bezier(0.2,0.7,0.3,1) 5.7s forwards;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { opacity: 0.65; transform: translate(-50%, -50%) scale(0.6); }
    100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.45); }
  }

  /* ── Text sequence ──
     t1 is absolute (it fades out before t2 arrives); t2 and t3 sit in
     normal flow so they can never overlap, even when t2 wraps. */
  .t-wrap { position: relative; min-height: 16vh; width: 100%; }
  .t1 {
    position: absolute; left: 0; right: 0; top: 0;
    font-family: 'Playfair Display', serif;
    font-size: min(4.6vh, 7.5vw); font-weight: 700; line-height: 1.2;
    color: var(--charcoal);
    text-shadow: 0 1px 0 rgba(255,255,255,0.85);
    opacity: 0;
    animation:
      rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 1.7s forwards,
      fadeout 0.8s ease 3.7s forwards;
  }
  @keyframes fadeout { to { opacity: 0; transform: translateY(-1.5vh); } }
  .t2 {
    font-family: 'Playfair Display', serif;
    font-size: min(4.6vh, 7.5vw); font-weight: 700; line-height: 1.2;
    color: var(--charcoal);
    text-shadow: 0 1px 0 rgba(255,255,255,0.85);
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22,0.9,0.3,1) 5.4s forwards;
  }
  .t3 {
    margin-top: 1.6vh;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: min(3.4vh, 5.5vw); font-weight: 600;
    color: var(--rose-dark);
    opacity: 0;
    animation: rise 1s cubic-bezier(0.22,0.9,0.3,1) 6.1s forwards;
  }

  .foot {
    display: flex; flex-direction: column; align-items: center; gap: 1.3vh;
    opacity: 0; animation: rise 1.1s ease-out 6.9s forwards;
  }
  .bloom { font-size: 3vh; }
  .tags {
    font-size: 1.5vh; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase;
    color: rgba(20,19,23,0.35);
  }
  .cta-pill {
    background: var(--rose-dark);
    color: #FBF8FA;
    border-radius: 100px;
    padding: 1.7vh 3.6vh;
    font-size: 1.75vh; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(125,100,120,0.35);
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="petals"></canvas>
    <div class="top">
      <div class="mark">MNC</div>
      <div class="mark-sub">My Nail Connection</div>
      <div class="aud">For Nail Techs</div>
      <div class="phase">The Glow Up</div>
    </div>
    <div class="mid">
      <div class="logo-wrap">
        <img class="logo-old" src="logo-2.png" alt="MNC 2.0 logo"/>
        <img class="logo-new" src="logo-3.png" alt="MNC 3.0 logo"/>
      </div>
      <div class="t-wrap">
        <div class="t1">You loved 2.0.</div>
        <div class="t2">3.0 is even better.</div>
        <div class="t3">Ridiculously better.</div>
      </div>
    </div>
    <div class="foot">
      <div class="bloom">🌸</div>
      <div class="cta-pill">Get on the list &nbsp;·&nbsp; www.mynailconnection.com</div>
      <div class="tags">#MNC3 &nbsp;·&nbsp; #MyNailConnection</div>
    </div>
  </div>

<script>
  const cv = document.getElementById('petals');
  const cx = cv.getContext('2d');
  let W, H, petals = [];
  const COLORS = ['rgba(191,166,187,', 'rgba(125,100,120,', 'rgba(217,198,214,'];

  function size() {
    const s = document.getElementById('stage');
    W = cv.width = s.clientWidth * devicePixelRatio;
    H = cv.height = s.clientHeight * devicePixelRatio;
  }
  window.addEventListener('resize', size); size();

  function spawn(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20,
      r: (3 + Math.random() * 6) * devicePixelRatio,
      vy: (0.25 + Math.random() * 0.5) * devicePixelRatio,
      vx: (Math.random() - 0.5) * 0.35 * devicePixelRatio,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.02,
      sway: Math.random() * Math.PI * 2,
      alpha: 0.18 + Math.random() * 0.2,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }
  for (let i = 0; i < 16; i++) petals.push(spawn(true));

  function frame() {
    cx.clearRect(0, 0, W, H);
    for (let p of petals) {
      p.sway += 0.012;
      p.x += p.vx + Math.sin(p.sway) * 0.3 * devicePixelRatio;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 30) Object.assign(p, spawn(false));
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.fillStyle = p.color + p.alpha + ')';
      cx.beginPath();
      cx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
      cx.fill();
      cx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();

  function replay() {
    const stage = document.getElementById('stage');
    stage.style.display = 'none';
    void stage.offsetHeight;
    stage.style.display = '';
  }
  document.addEventListener('click', replay);
  document.addEventListener('keydown', e => { if (e.code === 'Space') replay(); });
</script>
</body>
</html>
