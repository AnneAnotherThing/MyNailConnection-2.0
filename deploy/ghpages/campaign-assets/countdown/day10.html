<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>MNC 3.0, 10 Days</title>
<!-- Animated countdown page, 10 Days. Open full screen, record,
     post. Tap or press space to replay. Palette matches the 3.0 app
     (mauve system). Self-contained, needs internet only for fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rose:      #BFA6BB;
    --rose-light:#F7E8EE;
    --rose-mid:  #D9C6D6;
    --rose-dark: #7D6478;
    --cream:     #FBF8FA;
    --charcoal:  #141317;
    --muted:     #8B7F8A;
  }
  html, body { height: 100%; background: #F7F5F8; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--charcoal);
    display: flex; align-items: center; justify-content: center;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 0.5625));
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 15% 88%, rgba(191,166,187,0.30) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 6%, rgba(247,232,238,0.85) 0%, transparent 55%),
      #FBF8FA;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    text-align: center;
    padding: 7vh 6vw 5vh;
  }
  .stage::before {
    content: '';
    position: absolute; inset: -20%;
    background: radial-gradient(ellipse at 30% 70%, rgba(191,166,187,0.14) 0%, transparent 45%);
    animation: glowdrift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes glowdrift {
    from { transform: translate(-4%, 3%) scale(1); }
    to   { transform: translate(5%, -4%) scale(1.12); }
  }

  canvas#petals { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .top, .mid, .foot { position: relative; z-index: 2; }
  .top { display: flex; flex-direction: column; align-items: center; }

  .mark {
    font-family: 'Playfair Display', serif;
    font-size: 7.2vh; font-weight: 700; letter-spacing: 0.06em; line-height: 1;
    color: var(--charcoal);
    text-shadow: 0 2px 0 rgba(255,255,255,0.9);
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.25s forwards;
  }
  .mark-sub {
    margin-top: 0.8vh;
    font-size: 1.5vh; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--rose-dark);
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.45s forwards;
  }
  .aud {
    margin-top: 2.6vh;
    background: var(--rose-dark);
    color: #FBF8FA;
    border-radius: 100px;
    padding: 1.3vh 3.2vh;
    font-size: 1.9vh; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase;
    opacity: 0; animation: rise 0.9s cubic-bezier(0.22,0.9,0.3,1) 0.65s forwards;
  }
  .phase {
    margin-top: 2.8vh;
    font-size: 1.7vh; font-weight: 500; letter-spacing: 0.55em; text-transform: uppercase;
    color: var(--rose-dark);
    opacity: 0; animation: trackin 1.1s cubic-bezier(0.22,0.9,0.3,1) 0.9s forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(2.4vh); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes trackin {
    from { opacity: 0; letter-spacing: 0.9em; }
    to   { opacity: 1; letter-spacing: 0.55em; }
  }

  .mid { display: flex; flex-direction: column; align-items: center; }

  .num-wrap { position: relative; }
  .num {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 34vh; line-height: 0.9;
    background: linear-gradient(100deg, #6B5366 20%, #8F7389 42%, #BFA6BB 50%, #8F7389 58%, #6B5366 80%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    opacity: 0;
    animation:
      numdrop 1.05s cubic-bezier(0.16,1.24,0.3,1) 1.5s forwards,
      shimmer 4.5s ease-in-out 2.8s infinite;
  }
  @keyframes numdrop {
    0%   { opacity: 0; transform: translateY(-30vh) scale(1.06); }
    62%  { opacity: 1; transform: translateY(1.2vh) scale(0.99); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shimmer {
    0%   { background-position: 120% 0; }
    55%  { background-position: -60% 0; }
    100% { background-position: -60% 0; }
  }
  .num-wrap::after {
    content: '';
    position: absolute; left: 50%; top: 55%;
    width: 30vh; height: 30vh;
    border: 1px solid rgba(125,100,120,0.45);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.55);
    opacity: 0;
    animation: pulse 1.3s cubic-bezier(0.2,0.7,0.3,1) 2.3s forwards;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { opacity: 0.65; transform: translate(-50%, -50%) scale(0.55); }
    100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.5); }
  }

  .num-word {
    margin-top: 2.6vh;
    font-size: 1.9vh; font-weight: 500; letter-spacing: 0.55em; text-transform: uppercase;
    color: var(--rose-dark);
    opacity: 0; animation: rise 0.8s ease-out 2.35s forwards;
  }
  .rule {
    width: 11vh; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
    margin: 3.4vh auto 3.2vh;
    transform: scaleX(0);
    animation: rulegrow 0.8s cubic-bezier(0.22,0.9,0.3,1) 2.5s forwards;
  }
  @keyframes rulegrow { to { transform: scaleX(1); } }

  .l1 {
    font-family: 'Playfair Display', serif;
    font-size: 4.6vh; font-weight: 700; line-height: 1.2;
    color: var(--charcoal);
    text-shadow: 0 1px 0 rgba(255,255,255,0.85);
    max-width: 82vw;
    opacity: 0; animation: rise 1s cubic-bezier(0.22,0.9,0.3,1) 2.75s forwards;
  }
  .l2 {
    margin-top: 2.2vh;
    font-size: 2.2vh; font-weight: 400; line-height: 1.55;
    color: var(--muted); max-width: 74vw;
    opacity: 0; animation: rise 1s cubic-bezier(0.22,0.9,0.3,1) 3.25s forwards;
  }
  .l2 b { color: var(--rose-dark); font-weight: 600; }

  .foot {
    display: flex; flex-direction: column; align-items: center; gap: 1.3vh;
    opacity: 0; animation: rise 1.1s ease-out 3.9s forwards;
  }
  .bloom { font-size: 3vh; }
  .tags {
    font-size: 1.5vh; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase;
    color: rgba(20,19,23,0.35);
  }
  .cta-pill {
    background: var(--rose-dark);
    color: #FBF8FA;
    border-radius: 100px;
    padding: 1.7vh 3.6vh;
    font-size: 1.75vh; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(125,100,120,0.35);
  }

  /* Big-word treatment (day 5 "Free.") */
  body.bigword .num-wrap, body.bigword .num-word { display: none; }
  body.bigword .rule { animation-delay: 1.3s; }
  body.bigword .l1 {
    font-size: 15vh; font-style: italic; line-height: 1.05;
    background: linear-gradient(100deg, #6B5366 20%, #8F7389 42%, #BFA6BB 50%, #8F7389 58%, #6B5366 80%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: none;
    animation:
      freein 1.3s cubic-bezier(0.16,1.2,0.3,1) 1.5s forwards,
      shimmer 4.5s ease-in-out 3s infinite;
    opacity: 0;
    filter: blur(14px);
  }
  @keyframes freein {
    0%   { opacity: 0; transform: scale(0.6); filter: blur(14px); }
    70%  { opacity: 1; transform: scale(1.03); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  body.bigword .l2 { animation-delay: 3s; font-size: 2.6vh; }

  /* Drop day: "3.0" as the numeral, no DAYS word */
  body.dropday .num-word { display: none; }
</style>
</head>
<body class="">
  <div class="stage" id="stage">
    <canvas id="petals"></canvas>
    <div class="top">
      <div class="mark">MNC</div>
      <div class="mark-sub">My Nail Connection</div>
      <div class="aud">For Nail Techs</div>
      <div class="phase">You Asked</div>
    </div>
    <div class="mid">
      <div class="num-wrap"><div class="num">10</div></div>
      <div class="num-word">Days</div>
      <div class="rule"></div>
      <div class="l1">Your gallery IS your booking page.</div>
      <div class="l2">Client sees your work. Taps. <b>Books.</b></div>
    </div>
    <div class="foot">
      <div class="bloom">🌸</div>
      <div class="cta-pill">Get on the list &nbsp;·&nbsp; www.mynailconnection.com</div>
      <div class="tags">#MNC3 &nbsp;·&nbsp; #MyNailConnection</div>
    </div>
  </div>

<script>
  const cv = document.getElementById('petals');
  const cx = cv.getContext('2d');
  let W, H, petals = [];
  const COLORS = ['rgba(191,166,187,', 'rgba(125,100,120,', 'rgba(217,198,214,'];

  function size() {
    const s = document.getElementById('stage');
    W = cv.width = s.clientWidth * devicePixelRatio;
    H = cv.height = s.clientHeight * devicePixelRatio;
  }
  window.addEventListener('resize', size); size();

  function spawn(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20,
      r: (3 + Math.random() * 6) * devicePixelRatio,
      vy: (0.25 + Math.random() * 0.5) * devicePixelRatio,
      vx: (Math.random() - 0.5) * 0.35 * devicePixelRatio,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.02,
      sway: Math.random() * Math.PI * 2,
      alpha: 0.18 + Math.random() * 0.2,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }
  for (let i = 0; i < 16; i++) petals.push(spawn(true));

  function frame() {
    cx.clearRect(0, 0, W, H);
    for (let p of petals) {
      p.sway += 0.012;
      p.x += p.vx + Math.sin(p.sway) * 0.3 * devicePixelRatio;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 30) Object.assign(p, spawn(false));
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.fillStyle = p.color + p.alpha + ')';
      cx.beginPath();
      cx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
      cx.fill();
      cx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();

  function replay() {
    const stage = document.getElementById('stage');
    stage.style.display = 'none';
    void stage.offsetHeight;
    stage.style.display = '';
  }
  document.addEventListener('click', replay);
  document.addEventListener('keydown', e => { if (e.code === 'Space') replay(); });
</script>
</body>
</html>
