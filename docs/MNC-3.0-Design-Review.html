document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

de-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 400 800;\n  font-display: swap;\n  src: url(\"edf09e91-d76f-4e34-a66b-0e3bc29277ae\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 400 800;\n  font-display: swap;\n  src: url(\"db4964cb-436d-4e2d-84bd-d80720a5d91c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body{margin:0;padding:0;background:#F4F1F1;}\n  a{color:#A2636C;text-decoration:none;border-bottom:1px solid rgba(162,99,108,0.35);}\n  a:hover{color:#141317;border-bottom-color:#141317;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'DM Sans',sans-serif;background:#F4F1F1;color:#141317;padding:0 0 120px;\">\n\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 40px;\">\n\n    <!-- ── COVER ────────────────────────────────────────────── -->\n    <div style=\"padding:72px 0 40px;border-bottom:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">Design review · pre-launch<\u002Fdiv>\n      <h1 style=\"font-family:'Playfair Display',serif;font-size:56px;font-weight:600;line-height:1.05;letter-spacing:-0.5px;margin:14px 0 0;\">My Nail Connection 3.0<\u002Fh1>\n      <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#A2636C;margin-top:10px;\">Where the app fights the user, and how to stop it.<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:720px;margin-top:22px;text-wrap:pretty;\">\n        Read against <b>index.html<\u002Fb> (19,994 lines, 19 screens), the in-app tutorial system, and <b>How It Works<\u002Fb>. No colour or imagery changes proposed — this is about words, order, and friction. Everything below points at a specific line in your source.\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;\">\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:100px;padding:8px 16px;font-size:12.5px;font-weight:600;\">19 screens reviewed<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:100px;padding:8px 16px;font-size:12.5px;font-weight:600;\">31 findings<\u002Fdiv>\n        <div style=\"background:#141317;color:#fff;border-radius:100px;padding:8px 16px;font-size:12.5px;font-weight:600;\">9 launch blockers<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── THE HEADLINE ─────────────────────────────────────── -->\n    <div style=\"margin-top:56px;\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">The headline<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;max-width:860px;\">The app is well built. It just hasn't agreed with itself on what anything is called, or what a tech is supposed to do first.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:32px;\">\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:22px 22px 24px;\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:44px;line-height:1;color:#A2636C;\">01<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;margin-top:12px;\">One thing, four names<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;margin-top:8px;\">The tech's home screen is called <b>Tech Portal<\u002Fb>, <b>Dashboard<\u002Fb>, <b>Your Business<\u002Fb>, and <b>Profile<\u002Fb> depending on where you're standing. You caught it. There are eleven more like it.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:22px 22px 24px;\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:44px;line-height:1;color:#A2636C;\">02<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;margin-top:12px;\">Seven slides before one action<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;margin-top:8px;\">The tech tutorial is seven modal slides of instructions, delivered before the tech has seen the screen those instructions describe. Then it closes and leaves them alone.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:22px 22px 24px;\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:44px;line-height:1;color:#A2636C;\">03<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;margin-top:12px;\">The hook is buried<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;margin-top:8px;\">Free booking is the reason 3.0 exists. On the Tech Portal it's the second card, under a paragraph about ad spend. On the splash screen it isn't mentioned at all.<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── SECTION 1: LANGUAGE ──────────────────────────────── -->\n    <div style=\"margin-top:72px;padding-top:44px;border-top:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">Finding 1 · the big one<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">The vocabulary problem<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:760px;margin-top:14px;text-wrap:pretty;\">\n        You said it exactly right: nail techs aren't looking for a puzzle. Every time the app calls one thing by two names, the tech has to stop and work out whether they're the same thing. That pause is where people quit. Below is every collision I found, with the line to change.\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;margin-top:26px;overflow:hidden;\">\n        <div style=\"display:grid;grid-template-columns:1.1fr 1.5fr 1.1fr 90px;gap:0;background:#141317;color:#fff;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;\">\n          <div style=\"padding:14px 20px;\">The thing<\u002Fdiv>\n          <div style=\"padding:14px 20px;\">Called this today<\u002Fdiv>\n          <div style=\"padding:14px 20px;\">Call it this<\u002Fdiv>\n          <div style=\"padding:14px 20px;\">Lines<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ lexicon }}\" as=\"row\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:1.1fr 1.5fr 1.1fr 90px;gap:0;border-top:1px solid rgba(125,100,102,0.16);align-items:start;\">\n            <div style=\"padding:16px 20px;font-size:14px;font-weight:700;\">{{ row.thing }}<\u002Fdiv>\n            <div style=\"padding:16px 20px;font-size:13.5px;line-height:1.55;color:#8A5560;\">{{ row.today }}<\u002Fdiv>\n            <div style=\"padding:16px 20px;font-size:13.5px;line-height:1.55;font-weight:600;color:#3E6B4E;\">{{ row.fix }}<\u002Fdiv>\n            <div style=\"padding:16px 20px;font-size:12px;color:#8B7F8A;font-variant-numeric:tabular-nums;\">{{ row.lines }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background:#FAF7F2;border:1px solid #D0A3A5;border-radius:16px;padding:22px 24px;margin-top:22px;\">\n        <div style=\"font-size:15px;font-weight:700;\">The rule to hold everything to<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.65;color:#4A4A4F;margin-top:8px;max-width:840px;\">\n          A tech should never see a noun in the app that isn't printed on a button or a tab they can point at. If the tutorial says <b>Bookings<\u002Fb>, there is a thing labelled <b>Bookings<\u002Fb> on screen. If it says <b>Tech Portal<\u002Fb>, that's the tab name. No synonyms, no \"your dashboard,\" no \"your business.\"\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── SECTION 2: THE TUTORIAL ──────────────────────────── -->\n    <div style=\"margin-top:72px;padding-top:44px;border-top:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">Finding 2<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">The tutorial teaches instead of doing<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:760px;margin-top:14px;text-wrap:pretty;\">\n        Seven slides (<b>index.html:4335–4372<\u002Fb>) fire before the tech has ever seen their own screen. It's a manual for a room they haven't walked into. A tech who taps through it retains almost none of it — and the one who taps <i>X<\u002Fi> gets nothing at all.\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:34px;align-items:flex-start;margin-top:34px;flex-wrap:wrap;\">\n\n        <!-- BEFORE: tutorial slide -->\n        <div>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;\">\n            <div style=\"background:#8A5560;color:#fff;font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:100px;\">TODAY<\u002Fdiv>\n            <div style=\"font-size:13px;color:#8B7F8A;\">Slide 2 of 7<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:340px;height:600px;border-radius:34px;background:#fff;border:1px solid rgba(125,100,102,0.22);box-shadow:0 20px 50px rgba(20,19,23,0.14);overflow:hidden;position:relative;\">\n            <div style=\"position:absolute;inset:0;background:rgba(20,19,23,0.45);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;\">\n              <div style=\"background:#fff;border-radius:24px;padding:30px 24px 22px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px rgba(20,19,23,0.3);\">\n                <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:54px;height:54px;stroke:#DEB3B5;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;\"><path d=\"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n                <div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin-top:14px;\">First, make it yours.<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.6;color:#4A4A4F;margin-top:12px;text-align:left;\">From your <b style=\"background:#F7D7DB;padding:0 3px;\">Dashboard<\u002Fb>, open <b style=\"background:#F7D7DB;padding:0 3px;\">Edit Profile<\u002Fb>. Add your photo, a short bio, and your city so nearby clients can find you. This page is your storefront, and it's what every client sees first.<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.6;color:#4A4A4F;margin-top:12px;text-align:left;\">A friendly face and two warm sentences go further than you'd think.<\u002Fdiv>\n                <div style=\"display:flex;gap:5px;justify-content:center;margin-top:20px;\">\n                  <div style=\"width:6px;height:6px;border-radius:50%;background:#D0A3A5;\"><\u002Fdiv>\n ing 4<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">Client home asks a question instead of showing the goods<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:760px;margin-top:14px;text-wrap:pretty;\">\n        A first-time client lands on a greeting, a search box for a tech she doesn't know the name of, and four menu cards asking how she'd like to browse. She has to make three decisions before she sees a single fingernail. Meanwhile the bottom nav is <b>Home · Profile · Sign Out<\u002Fb> — a third of it is a logout button, and there's no way back to the Gallery except through Home.\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:34px;align-items:flex-start;margin-top:34px;flex-wrap:wrap;\">\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;\">\n            <div style=\"background:#8A5560;color:#fff;font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:100px;\">TODAY<\u002Fdiv>\n            <div style=\"font-size:13px;color:#8B7F8A;\">home<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:340px;border-radius:34px;background:#fff;border:1px solid rgba(125,100,102,0.22);box-shadow:0 20px 50px rgba(20,19,23,0.14);overflow:hidden;display:flex;flex-direction:column;\">\n            <div style=\"padding:16px;border-bottom:1px solid rgba(222,179,181,0.24);display:flex;align-items:center;justify-content:space-between;\">\n              <div>\n                <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:19px;font-weight:700;\">My Nail Connection<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#A2636C;margin-top:3px;\">Find · Connect · Glow<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:30px;height:30px;border-radius:50%;bac                <div style=\"aspect-ratio:1;border-radius:12px;background:#EDE7E6;\"><\u002Fdiv>\n                <div style=\"aspect-ratio:1;border-radius:12px;background:#E9E0E0;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;border-top:1px solid rgba(162,99,108,0.16);display:flex;padding:8px 6px 14px;background:rgba(255,255,255,0.94);\">\n              <div style=\"flex:1;text-align:center;background:linear-gradient(160deg,#F7E2E3,#EFCFD2);border-radius:12px;padding:6px;\"><div style=\"font-size:9.5px;font-weight:700;color:#A2636C;\">Looks<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:6px;\"><div style=\"font-size:9.5px;font-weight:600;color:#7C6169;\">Map<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:6px;\"><div style=\"font-size:9.5px;font-weight:600;color:#7C6169;\">Saved<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;text-align:center;padding:6px;\"><div style=\"font-size:9.5px;font-weight:600;color:#7C6169;\">Me<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:280px;\">\n          <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:24px;\">\n            <div style=\"font-size:16px;font-weight:700;\">What changed, and why<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:15px;margin-top:16px;\">\n              <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;\"><b style=\"color:#141317;\">Home <i>is<\u002Fi> the Gallery.<\u002Fb> “Browse by” is a menu describing a menu. Every card on it becomes a filter chip on the photos themselves — same filters, one fewer screen.<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;\"><b style=\"color:#141317;\">Sign Out leaves the nav.<\u002Fb> A logout button occupying 33% of primary navigation is a mistake worth fixing on its own. It belongs under the avatar, where it already is for techs (line 1609).<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;\"><b style=\"color:#141317;\">Map and Saved get real tabs.<\u002Fb> Right now saved Inspo lives at Profile → Inspo, three taps deep, and the tutorial has to explain how to find it (line 4320). A tab needs no explanation.<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;\"><b style=\"color:#141317;\">Search by name moves into the Gallery header.<\u002Fb> It's a high-intent shortcut for returning clients, not a first-run question. Fewer than one in ten first-time visitors know a tech's name.<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#4A4A4F;\"><b style=\"color:#141317;\">This directly serves the techs.<\u002Fb> Photos are the paid product. Every extra tap between opening the app and seeing photos is a tap that devalues what techs are buying.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── SECTION 5: FULL SWEEP ────────────────────────────── -->\n    <div style=\"margin-top:72px;padding-top:44px;border-top:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">The full sweep<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">Everything else, screen by screen<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:760px;margin-top:14px;\">Smaller findings, grouped by where they live. Severity is about launch risk, not effort.<\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:28px;\">\n        <sc-for list=\"{{ sweep }}\" as=\"grp\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;overflow:hidden;\">\n            <div style=\"padding:16px 22px;background:#FBF8F8;border-bottom:1px solid rgba(125,100,102,0.16);display:flex;align-items:baseline;gap:12px;\">\n              <div style=\"font-family:'Playfair Display',serif;font-size:19px;font-weight:600;\">{{ grp.screen }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#8B7F8A;font-family:ui-monospace,monospace;\">{{ grp.id }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ grp.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:78px 1fr 1.1fr;gap:0;border-top:1px solid rgba(125,100,102,0.1);align-items:start;\">\n                <div style=\"padding:15px 0 15px 22px;\">\n                  <div style=\"display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1.1px;padding:3px 8px;border-radius:100px;background:{{ it.sevBg }};color:{{ it.sevFg }};\">{{ it.sev }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:15px 20px 15px 12px;font-size:13.5px;line-height:1.55;\">{{ it.problem }}<\u002Fdiv>\n                <div style=\"padding:15px 22px 15px 0;font-size:13.5px;line-height:1.55;color:#3E6B4E;\">{{ it.fix }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── SECTION 6: PUNCH LIST ────────────────────────────── -->\n    <div style=\"margin-top:72px;padding-top:44px;border-top:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">Paste-ready<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">Fix-before-launch punch list<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.65;color:#4A4A4F;max-width:760px;margin-top:14px;\">In the order I'd do them. The first four are a single afternoon and remove most of the confusion you're seeing in test.<\u002Fdiv>\n\n      <div style=\"background:#141317;border-radius:20px;padding:8px 0;margin-top:26px;\">\n        <sc-for list=\"{{ punch }}\" as=\"p\" hint-placeholder-count=\"9\">\n          <div style=\"display:flex;gap:18px;align-items:flex-start;padding:16px 26px;border-bottom:1px solid rgba(255,255,255,0.08);\">\n            <div style=\"font-family:'Playfair Display',serif;font-size:24px;color:#DEB3B5;line-height:1;width:34px;flex-shrink:0;font-variant-numeric:tabular-nums;\">{{ p.n }}<\u002Fdiv>\n            <div style=\"flex:1;\">\n              <div style=\"font-size:15px;font-weight:700;color:#fff;\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.6;color:rgba(255,255,255,0.66);margin-top:4px;\">{{ p.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex-shrink:0;text-align:right;\">\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:{{ p.tagColor }};\">{{ p.tag }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:rgba(255,255,255,0.4);margin-top:3px;\">{{ p.effort }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── SECTION 7: TO DISCUSS ────────────────────────────── -->\n    <div style=\"margin-top:72px;padding-top:44px;border-top:1px solid rgba(125,100,102,0.16);\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7F8A;\">Before I touch index.html<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.2;margin:12px 0 0;\">Four things I'd rather decide with you<\u002Fh2>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px;\">\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:24px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A2636C;\">Money<\u002Fdiv>\n          <div style=\"font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-top:8px;line-height:1.25;\">Photos-as-ad-spend is a hard sell on day one<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">A tech who's never been booked through MNC is being asked to pay $1 a photo to advertise on a platform with no clients on it yet. That's the cold-start problem, and the Tech Portal copy leans <i>into<\u002Fi> it rather than away.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\"><b>Worth discussing:<\u002Fb> a generous launch grant (say 10 free photos for the founding techs, visible as “10 free looks, on us”) turns the pricing conversation into a gift, and gets the Gallery full enough to be worth a client's time. You already have the machinery — <code style=\"font-size:12px;background:#EDE7E6;padding:1px 5px;border-radius:4px;\">first-photo-free-migration.sql<\u002Fcode> and <code style=\"font-size:12px;background:#EDE7E6;padding:1px 5px;border-radius:4px;\">founders-comp-grant.sql<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:24px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A2636C;\">Navigation<\u002Fdiv>\n          <div style=\"font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-top:8px;line-height:1.25;\">Am I allowed to change the bottom nav?<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">The client nav is Home / Profile / Sign Out and the tech nav is Home / Tech Portal / Sign Out. Both spend a slot on logging out, and neither gets you to the Gallery, the map, or your saved looks.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">It's the single highest-leverage change in this document, and also the one most likely to make Leslie say “what happened to my app.” Your call — I'd do it, but I'd do it with you watching.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:24px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A2636C;\">Legibility<\u002Fdiv>\n          <div style=\"font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-top:8px;line-height:1.25;\">There is a lot of 11px type<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">Feed body text is 11px, card sublines 11.5px, availability counts 11px, nav labels 10px. On a phone, at arm's length, for anyone over about forty, that's a squint. Your techs skew older than your clients.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\"><b>My recommendation:<\u002Fb> a floor of 13px for anything a user has to read, 11px only for uppercase labels. It costs vertical space, which is why I want to agree on it before I start.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(125,100,102,0.16);border-radius:18px;padding:24px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A2636C;\">Scope<\u002Fdiv>\n          <div style=\"font-family:'Playfair Display',serif;font-size:21px;font-weight:600;margin-top:8px;line-height:1.25;\">How much of this do you want in code?<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">Punch-list items 1–4 are pure find-and-replace and copy edits — low risk, and I can ship them the moment you say go.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4A4F;margin-top:10px;\">Items 5–9 move markup around in a 20,000-line file that has a documented history of truncating on large edits. Those I'd do one at a time, with a sync and a look after each.<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"background:#FAF7F2;border:1px solid #D0A3A5;border-radius:18px;padding:28px 30px;margin-top:26px;\">\n        <div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:600;\">What I'd do next, if you want a recommendation<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.7;color:#4A4A4F;margin-top:10px;max-width:820px;text-wrap:pretty;\">\n          Say the word and I'll ship punch-list items 1–4 into <b>index.html<\u002Fb> today — the language sweep, the tutorial rewrite, the Bookings promotion, and the ad-spend copy cut. That's the whole “why is this confusing” complaint, gone, without touching a single colour, image, or navigation structure. Then we look at it together and decide whether the nav and the client home are worth opening up before launch.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:900}}\">\nconst SEV = {\n  block: { sev: 'BLOCKER', sevBg: '#141317', sevFg: '#FFFFFF' },\n  high:  { sev: 'HIGH',    sevBg: '#F3DCDF', sevFg: '#8A5560' },\n  med:   { sev: 'MEDIUM',  sevBg: '#EDE7E6', sevFg: '#6B5F63' },\n  low:   { sev: 'POLISH',  sevBg: '#F1F1F1', sevFg: '#8B7F8A' }\n};\n\nclass Component extends DCLogic {\n  renderVals() {\n    const sweep = [\n      {\n        screen: 'Splash', id: '#splash · line 1214',\n        items: [\n          ['high', 'The splash never says what MNC does for a tech. Three buttons and a tagline — a tech arriving from a QR code learns nothing about free booking.', 'Add one line under “Beauty. Connected.”: “Free booking for nail techs. Always.” It is the entire pitch and it is currently absent from the front door.'],\n          ['med', '“Browse as Guest” leads, then a 3-line caption explaining what guests cannot do, then two more buttons. Five things to read before a first tap.', 'Cut the caption to one line: “Sign in when you are ready to book.” Move the tech-photo caveat to the point of need.'],\n          ['low', '“Create a Free Account” and “Sign In” are visually identical secondary buttons, so returning users hunt.', 'Give Sign In the quieter treatment; new accounts are the growth path.']\n        ]\n      },\n      {\n        screen: 'Sign-up flow', id: '#signup → #signup-role → #signup-location',\n        items: [\n          ['high', 'The progress bar says “Step 1 of 3”, but techs then get a fourth screen (#signup-tech). The count is wrong for exactly the audience you most need to keep.', 'Make the label dynamic: “Step 1 of 4” once role = tech. The code already branches here; only the label lies.'],\n          ['med', 'Role step says “Tell us a little about yourself” — the same sentence as step 1 (“Tell us about yourself”). Two different questions, one wording.', 'Step 2 becomes “Which one are you?” with the two cards. Plain, unmistakable.'],\n          ['med', 'Password field asks for 8 characters on a phone keyboard, then a separate SMS flow exists (#phone-auth) that needs no password at all. Two doors, no signposting.', 'Pick one for launch. If phone auth works, make it the default and hide email/password behind “Use email instead”.']\n        ]\n      },\n      {\n        screen: 'The Look / Gallery', id: '#browse-style · line 1758',\n        items: [\n          ['high', 'Called “The Look” on the home card, “Gallery” in the tutorial, “the feed” on the Tech Portal, and “browse by style” in the code. Four names for the main product surface.', 'Pick “Gallery”. It is the word the tutorial and How It Works already use most, and it is what techs will say to each other.'],\n          ['med', 'Filters are shape/type/style/distance — 33 possible tags. No indication of how many photos match before you commit to a filter.', 'Show the count on the apply button: “Show 41 looks”. Empty-result dead ends are the fastest way to lose a first-time client.']\n        ]\n      },\n      {\n        screen: 'Tech detail', id: '#tech-detail · line 1884',\n        items: [\n          ['block', 'Book, Book Now (external link), Call and Text can all be present at once, with no hierarchy explaining which one the tech actually wants used.', 'One primary action, chosen by the tech in setup. The rest go into a secondary row. A client facing four equal buttons picks none.'],\n          ['med', 'The Glow Up badge appears on tech cards and profiles. A client has no idea what Glow Up is, and it reads as a quality signal it is not meant to be.', 'Either drop it from client-facing surfaces or label it something a client understands. Right now it advertises your pricing tiers to the wrong audience.']\n        ]\n      },\n      {\n        screen: 'My Photos / tagging', id: '#my-photos · line 2208',\n        items: [\n          ['high', 'Tagging is where techs get discovered, and it is entirely optional and entirely after the fact. The nudge card only appears once photos are already untagged.', 'Tag during upload, as a required step, with the three categories on one screen. Turning it into cleanup work guarantees it does not happen.'],\n          ['med', '33 tags across three categories presented as flat chip lists. No “most used”, no search, no defaults.', 'Pre-select the tech’s three most-used tags per category. Most techs post variations of the same handful of looks.']\n        ]\n      },\n      {\n        screen: 'Bookings', id: '#tech-bookings · line 2358',\n        items: [\n          ['block', 'Setting up booking means services, durations, prices, and weekly hours before the toggle does anything. That is the highest-effort task in the app and it is the one the whole 3.0 pitch depends on.', 'Ship a one-tap default: “Full set · 90 min · $65” plus Mon–Fri 9–5, editable after. A tech can be bookable in ten seconds and refine later.'],\n          ['high', 'A tech who never finishes setup shows a Bookings card reading “Set up free booking” forever, with no sense of how close she is.', '“2 of 3 steps done — add your hours to go live.” Same card, honest state.']\n        ]\n      },\n      {\n        screen: 'How It Works', id: '#how-it-works · line 2492',\n        items: [\n          ['high', 'Says “Open Bookings on your Dashboard” (line 2513). No Dashboard exists. Same defect as the tutorial.', 'Global replace to “Tech Portal”.'],\n          ['med', 'Five long sections in one scroll, written for a tech who has already decided to invest. New techs will not read it, and there is no way to jump to the one answer they came for.', 'Add a short question index at the top. Or better: link individual sections from the exact place the question arises.'],\n          ['low', 'Bottom nav on this screen shows Home / Tech Portal / Sign Out even for clients, who then see a Tech Portal button that is not theirs.', 'Role-gate the nav, as the home screen already does via styleNavForRole().']\n        ]\n      },\n      {\n        screen: 'Global', id: 'across all screens',\n        items: [\n          ['high', 'Text below 12px is everywhere: 11px body copy in feed cards, 11.5px card sublines, 10px nav labels. Your techs are not twenty-five.', '13px floor for read-it copy; reserve 11px for uppercase labels only.'],\n          ['med', 'Sign Out occupies a full third of the bottom nav on every screen, at 55% opacity, next to the things people actually use.', 'Move it under the avatar. That pattern already exists for techs on home (line 1609) — it just was not applied everywhere.'],\n          ['med', 'Empty states exist as a styled component (.empty-state) but several surfaces show a bare “, techs” or a blank grid while data loads.', 'Wire the existing component in everywhere. The blank “, techs” on the home availability cards is visible in test right now.'],\n          ['low', 'Back behaviour is a mix of backSmart(), backFromAuth(), backFromMyPhotos() and a hardware-back handler with its own root-screen list.', 'Not user-visible today, but it is where the next “it backed me out” bug will come from.']\n        ]\n      }\n    ];\n\n    return {\n      lexicon: [\n        { thing: 'The tech home screen', today: 'Tech Portal (nav) · Dashboard (tutorial, How It Works) · Your Business (contact modal) · Profile (code comments)', fix: 'Tech Portal — everywhere', lines: '2191, 2513, 4339, 4349, 4359, 16505' },\n        { thing: 'Editing your profile', today: 'Edit Profile (tutorial) · Manage Profile (the actual button) · Manage (older copy) · the tech-edit modal', fix: 'Edit Profile', lines: '4339, 2145' },\n        { thing: 'The photo grid clients browse', today: 'The Look (home card) · Gallery (tutorial, How It Works) · the live feed (Tech Portal) · browse-style (code)', fix: 'Gallery', lines: '1758, 2088, 2528, 4318' },\n        { thing: 'A tech\\u2019s own photos', today: 'My Photos (screen) · My Gallery (nav comment) · Portfolio (profile tab) · Looks (stat label)', fix: 'My Gallery', lines: '2208, 1607, 2044' },\n        { thing: 'Being open for work', today: 'Available Today · Available now · Open today (portal chip) · Open This Week · This Week · Accepting new clients · New clients welcome', fix: 'Open today / Open this week / Taking new clients', lines: '1698, 2013, 2018' },\n        { thing: 'Booking', today: 'Bookings · Book · Book Now (external) · your book · booking system', fix: 'Bookings (the screen) · Book (the button)', lines: '2358, 2513, 4349' },\n        { thing: 'Saved photos', today: 'Inspo · Saves (stat) · Favorites (techs) · hearts', fix: 'Saved looks (photos) · Favorites (techs)', lines: '2047, 4320' },\n        { thing: 'Getting help', today: 'Nudge support · What\\u2019s glitchy? · Contact Anne · Contact the developer · Need help? Contact support', fix: 'Get help', lines: '2199, 19243' }\n      ],\n\n      sweep: sweep.map(g => ({\n        screen: g.screen,\n        id: g.id,\n        items: g.items.map(([sev, problem, fix]) => ({ ...SEV[sev], problem, fix }))\n      })),\n\n      punch: [\n        { n: '01', title: 'Global language sweep', detail: 'Replace every “Dashboard” with “Tech Portal”, every “The Look” / “feed” with “Gallery”, every “Edit Profile” / “Manage” pair with one word. Eight collisions, listed above.', tag: 'Blocker', tagColor: '#DEB3B5', effort: '~1 hour' },\n        { n: '02', title: 'Cut the tech tutorial to two slides', detail: 'Keep “You\\u2019re in, welcome” and “Here\\u2019s what clients see.” Move the four instructional slides into a persistent setup checklist on the Tech Portal.', tag: 'Blocker', tagColor: '#DEB3B5', effort: 'half day' },\n        { n: '03', title: 'Promote Bookings on the Tech Portal', detail: 'Move the Bookings card above the photos card and give it the dark treatment. Show real state: appointments this week, requests waiting.', tag: 'Blocker', tagColor: '#DEB3B5', effort: '~2 hours' },\n        { n: '04', title: 'Cut the ad-spend copy to one line', detail: 'The heading, the paragraph and three bullets on tech-home become: “More looks, more of the Gallery is yours.” with a link to How It Works.', tag: 'Blocker', tagColor: '#DEB3B5', effort: '~30 min' },\n        { n: '05', title: 'Fix the “Step 1 of 3” lie for techs', detail: 'Techs get four steps. The label says three. First impression, wrong number.', tag: 'High', tagColor: '#E8B4B8', effort: '~15 min' },\n        { n: '06', title: 'One-tap booking defaults', detail: 'Pre-fill one service and Mon–Fri hours so a tech can be bookable immediately and refine later. Removes the biggest abandonment cliff in the product.', tag: 'High', tagColor: '#E8B4B8', effort: '~half day' },\n        { n: '07', title: 'Tag photos during upload, not after', detail: 'Make shape / type / style part of the upload sheet. Untagged photos cannot be found, and finding is the thing techs are paying for.', tag: 'High', tagColor: '#E8B4B8', effort: '~half day' },\n        { n: '08', title: '13px minimum for body copy', detail: 'Raise 11px and 11.5px read-it text app-wide. Uppercase labels may stay small.', tag: 'High', tagColor: '#E8B4B8', effort: '~2 hours' },\n        { n: '09', title: 'Get Sign Out out of the bottom nav', detail: 'Move it under the avatar on every screen, as home already does for techs. Frees a nav slot for Gallery or Saved.', tag: 'High', tagColor: '#E8B4B8', effort: '~1 hour' },\n        { n: '10', title: 'One primary action on tech-detail', detail: 'Book, Book Now, Call and Text cannot all be primary. Let the tech pick which one clients see first.', tag: 'Medium', tagColor: '#C9BDB6', effort: '~3 hours' },\n        { n: '11', title: 'Match counts on Gallery filters', detail: '“Show 41 looks” on the apply button. Prevents the empty-result dead end.', tag: 'Medium', tagColor: '#C9BDB6', effort: '~2 hours' },\n        { n: '12', title: 'Free-booking line on the splash', detail: 'One sentence so a tech scanning a QR code learns the offer before deciding whether to install.', tag: 'Medium', tagColor: '#C9BDB6', effort: '~15 min' }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
